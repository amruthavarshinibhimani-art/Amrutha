<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Event Planner</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand">
            AI Event Planner
        </span>

    </div>

</nav>


<div class="container">

    <div class="hero">

        <h1>AI Event Planner</h1>

        <p>
            Create a personalized event plan using Artificial Intelligence
        </p>

    </div>


    <div class="card event-card">

        <h2>Enter Event Details</h2>


        <form action="/generate" method="POST">


            <div class="mb-3">

                <label class="form-label">
                    Event Name
                </label>

                <input
                    type="text"
                    name="event_name"
                    class="form-control"
                    placeholder="Example: Birthday Party"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Event Type
                </label>

                <select
                    name="event_type"
                    class="form-control"
                    required>

                    <option value="">
                        Select Event Type
                    </option>

                    <option value="Birthday">
                        Birthday
                    </option>

                    <option value="Wedding">
                        Wedding
                    </option>

                    <option value="College Event">
                        College Event
                    </option>

                    <option value="Corporate Event">
                        Corporate Event
                    </option>

                    <option value="Conference">
                        Conference
                    </option>

                    <option value="Party">
                        Party
                    </option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Event Date
                </label>

                <input
                    type="date"
                    name="event_date"
                    class="form-control"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Number of Guests
                </label>

                <input
                    type="number"
                    name="guests"
                    class="form-control"
                    placeholder="Example: 50"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Budget (₹)
                </label>

                <input
                    type="number"
                    name="budget"
                    class="form-control"
                    placeholder="Example: 30000"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Venue
                </label>

                <input
                    type="text"
                    name="venue"
                    class="form-control"
                    placeholder="Example: Hyderabad"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Preferences
                </label>

                <textarea
                    name="preferences"
                    class="form-control"
                    rows="4"
                    placeholder="Example: Traditional decoration, vegetarian food, music">
                </textarea>

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100">

                Generate AI Event Plan

            </button>


        </form>

    </div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
